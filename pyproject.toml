[project]
name = "schedgym"
version = "0.1.0"
description = "JAX/RL Kubernetes-style scheduler research project"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "flax>=0.9.0",
    "optax>=0.2.2",
    "distrax>=0.1.5",
    "chex>=0.1.86",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
