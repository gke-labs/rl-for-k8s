apiVersion: v1
kind: Pod
metadata:
  name: web-1
  labels:
    app: web
    tier: frontend
spec:
  containers:
    - name: web
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
      ports:
        - containerPort: 8080
  nodeSelector:
    disktype: ssd
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: web
          topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: web
---
